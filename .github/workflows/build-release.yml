name: Build Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 需要完整历史：versionCode = git 提交数（git rev-list --count HEAD）
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (cached)
        uses: gradle/actions/setup-gradle@v4

      
      - name: Build signed release APK
        
        run: ./gradlew assembleRelease -x lintVitalRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: cam2magic-release-apk
          path: app/build/outputs/apk/release/*.apk
